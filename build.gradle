plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Ensure the source files are read and compiled with the correct encoding
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    enable {
        // NeoForge version for Minecraft 1.21.1
        version = project.neo_version

        // Vineflower's decompile pass needs a >4 GB heap; on small CI hosts pass
        // -Punbound.noRecompile to skip the decompile/recompile round-trip and
        // compile against the patched binary directly
        disableRecompilation = providers.gradleProperty('unbound.noRecompile').isPresent()
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument('--nogui')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// keep neoforge.mods.toml in sync with gradle.properties (the version used to
// be hardcoded there and silently drifted several releases behind)
tasks.processResources {
    var replaceProps = [
        "mod_version": project.mod_version.toString(),
        "mod_id"     : project.mod_id.toString(),
        "mod_name"   : project.mod_name.toString()
    ]
    inputs.properties(replaceProps)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(replaceProps)
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.jar.archiveVersion.getOrElse(project.mod_version),
            'Implementation-Vendor' : project.mod_authors
        ])
    }
}
